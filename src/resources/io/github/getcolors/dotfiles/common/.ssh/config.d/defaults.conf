# Managed by getcolors/dotfiles. Wire it into ~/.ssh/config with one line:
#
#     Include ~/.ssh/config.d/*.conf
#
# `Match final all` is evaluated on ssh's second configuration pass, after every
# other block has been read, and ssh keeps the first value it obtains for a
# keyword. These therefore stay true defaults: any Host block wins over them no
# matter where the Include sits. That matters because ansible appends managed
# Host blocks to ~/.ssh/config and we do not control where they land.
Match final all
{% if profile = "macos" %}    # UseKeychain exists only in Apple's OpenSSH. IgnoreUnknown stops a non-Apple
    # ssh (Homebrew's, or this file on Linux) from aborting every connection with
    # "Bad configuration option: usekeychain".
    IgnoreUnknown UseKeychain
    UseKeychain yes
{% endif %}    AddKeysToAgent yes

    # Not "-TERM COLORTERM": a leading "-" only removes names already on the send
    # list, and TERM is never on it -- the protocol always sends TERM with a pty,
    # so it was a no-op. The server still needs `AcceptEnv COLORTERM` in its
    # sshd_config for this to arrive.
    SendEnv COLORTERM
