name: Test and Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra test
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/test-launcher.py

  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create immutable revision tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            [ "$remote_sha" = "$local_sha" ] && exit 0
            echo "::error::Refusing to move existing tag ${tag}"; exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
